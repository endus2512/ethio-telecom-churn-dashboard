name: SON project checks

on:
  push:
    paths:
      - "ethio_telecom_son/**"
      - ".github/workflows/son-ci.yml"
  pull_request:
    paths:
      - "ethio_telecom_son/**"
      - ".github/workflows/son-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethio_telecom_son
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ethio_telecom_son/requirements.txt
            ethio_telecom_son/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py src tests
      - run: bash -n run_local.sh

  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethio_telecom_son
    env:
      POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
      SON_JWT_SECRET: ci-only-signing-secret-at-least-32-characters
      SON_INGESTION_API_TOKEN: ci-only-ingestion-token
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend and frontend images
        run: docker compose build backend frontend
